  .sheet {
    position: absolute; width: 300px; height: 370px; background: #FFFFFF;
    box-shadow: 0 14px 28px rgba(80,50,0,.22); border-radius: 4px;
    display: grid; place-items: center;
  }
  .sheet::before { content: ""; position: absolute; top: -20px; left: 50%; width: 120px; height: 40px; margin-left: -60px; background: rgba(255,111,145,.7); transform: rotate(-4deg); }
  .sheet svg { width: 240px; height: 290px; }
