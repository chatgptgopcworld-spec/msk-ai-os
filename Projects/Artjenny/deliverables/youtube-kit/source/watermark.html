<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; width: 600px; height: 600px; overflow: hidden; background: transparent; }
  .badge {
    position: absolute; left: 12px; top: 12px; width: 576px; height: 576px; box-sizing: border-box;
    border-radius: 50%; background: #FFFFFF; border: 22px solid #1B1A1F;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Permanent Marker", cursive; color: #1B1A1F; line-height: .9;
  }
  .a { font-size: 168px; }
  .j { font-size: 150px; margin-top: -6px; }
  .heart { position: absolute; right: 70px; top: 70px; width: 110px; transform: rotate(14deg); }
  .u { width: 300px; height: 18px; background: #FFD23F; border-radius: 9px; margin-top: 8px; }
</style></head><body>
<div class="badge">
  <span class="a">art</span><span class="j">jenny</span><span class="u"></span>
  <svg class="heart" viewBox="0 0 100 100"><path d="M50 86 C10 58 4 30 22 16 C36 6 48 14 50 26 C52 14 64 6 78 16 C96 30 90 58 50 86 Z" fill="#FF6F91" stroke="#1B1A1F" stroke-width="6" stroke-linejoin="round"/></svg>
</div>
</body></html>
